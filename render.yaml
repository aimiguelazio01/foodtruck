# Free API. PostgreSQL and private image storage are provided by Supabase Free.
services:
  - type: web
    name: foodtruck-api
    runtime: node
    region: frankfurt
    plan: free
    branch: master
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build --workspace=@foodtruck/api
    startCommand: node scripts/render-start.mjs api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: NODE_EXTRA_CA_CERTS
        value: services/api/certs/supabase.crt
      - key: HOST
        value: 0.0.0.0
      - key: RUN_MAINTENANCE
        value: "1"
      - key: DEMO_MODE
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://yyzyjscbeurqvkulnepl.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: foodtruck-media
      - key: CUSTOMER_APP_URL
        value: https://foodtruck-swart.vercel.app
      - key: MANAGEMENT_APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
