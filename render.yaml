# Paid resources. Review Render's quoted costs before applying this Blueprint.
services:
  - type: web
    name: foodtruck-api
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    branch: master
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/v1/health
    disk:
      name: foodtruck-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foodtruck-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIRECTORY
        value: /var/data
      - key: DEMO_MODE
        value: "0"
      - key: CUSTOMER_APP_URL
        value: https://foodtruck-swart.vercel.app
      - key: MANAGEMENT_APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
  - type: worker
    name: foodtruck-worker
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    branch: master
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    dockerCommand: node scripts/render-start.mjs worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: foodtruck-db
          property: connectionString
databases:
  - name: foodtruck-db
    region: frankfurt
    plan: 0.1c-256mb
    databaseName: foodtruck
    user: foodtruck
    postgresMajorVersion: "18"
    diskSizeGB: 15
    ipAllowList: []
