services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: foodtruck
      POSTGRES_USER: foodtruck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodtruck -d foodtruck"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  api:
    build: {context: ., dockerfile: Dockerfile.network}
    env_file: .env.network
    environment:
      DATABASE_URL: postgres://foodtruck:${POSTGRES_PASSWORD}@postgres:5432/foodtruck
      PORT: "4000"
      HOST: 0.0.0.0
    volumes: ["media_data:/workspace/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  worker:
    build: {context: ., dockerfile: Dockerfile.network}
    command: ["npm", "run", "worker", "--workspace=@foodtruck/api"]
    env_file: .env.network
    environment:
      DATABASE_URL: postgres://foodtruck:${POSTGRES_PASSWORD}@postgres:5432/foodtruck
      DATA_DIRECTORY: /workspace/data
    volumes: ["media_data:/workspace/data"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  customer:
    build: {context: ., dockerfile: Dockerfile.network}
    command: ["npm", "run", "start", "--workspace=food-truck-customer", "--", "-p", "3000"]
    env_file: .env.network
    environment: {INTERNAL_API_URL: "http://api:4000"}
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  management:
    build: {context: ., dockerfile: Dockerfile.network}
    command: ["npm", "run", "start", "--workspace=food-truck-management", "--", "-p", "3001"]
    env_file: .env.network
    environment: {INTERNAL_API_URL: "http://api:4000"}
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  gateway:
    image: caddy:2
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      CUSTOMER_DOMAIN: ${CUSTOMER_DOMAIN:?Set CUSTOMER_DOMAIN}
      MANAGEMENT_DOMAIN: ${MANAGEMENT_DOMAIN:?Set MANAGEMENT_DOMAIN}
    volumes: ["./Caddyfile.network:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [customer, management]
    restart: unless-stopped
volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
